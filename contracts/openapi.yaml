      operationId: listPatientTrails
      summary: Listar trilhas semanais do paciente
      description: |
        Profissional vinculado ou responsável da criança.
        weekStartDate é normalizado para a segunda-feira da semana (ISO).
        `canManage` indica se o usuário pode criar/editar/sugerir a trilha
        (profissional dono do paciente, ou responsável da criança).
        `hasActiveProfessionalLink` indica se a criança tem vínculo profissional ativo.
      security:
