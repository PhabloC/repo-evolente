        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
  /guardians/me:
    get:
      tags: [Guardians]
      operationId: getMyGuardianProfile
      summary: Perfil do responsável autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Perfil do responsável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianProfile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Guardians]
      operationId: updateMyGuardianProfile
      summary: Atualizar campos seguros do perfil do responsável
      description: |
        Permite atualizar `name` (usuário) e/ou `phone` (usuário).
        `kinship` no perfil do responsável é legado; o parentesco canônico é do filho.
        E-mail, CPF, nascimento e sexo não são editáveis por este endpoint.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyGuardianProfileRequest"
      responses:
        "200":
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianProfile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /guardians/me/children/{childId}:
    get:
      tags: [Guardians]
      operationId: getMyChild
      summary: Obter perfil e anamnese de um filho do responsável
      description: |
        Isolamento: filho de outra conta retorna 403.
        Usado pela área web do responsável para o perfil individual.
      security:
        - bearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Filho e anamnese
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianChildDetailResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Guardians]
      operationId: updateMyChild
      summary: Atualizar campos seguros da criança do responsável
      description: |
        Permite atualizar `fullName`, `sex` e/ou `kinship`.
        Código do paciente, CPF e data de nascimento não são editáveis.
      security:
        - bearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMyChildRequest"
      responses:
        "200":
          description: Criança atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /guardians/me/children/{childId}/avatar:
    post:
      tags: [Guardians]
      operationId: uploadMyChildAvatar
      summary: Upload da foto de perfil da criança pelo responsável
      description: |
        Envia imagem em Base64 (sem prefixo data-URL) para o bucket.
        Aceita `image/jpeg`, `image/png` e `image/webp`.
        Somente o responsável vinculado à criança pode atualizar.
      security:
        - bearerAuth: []
      parameters:
        - name: childId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadImageBase64Request"
      responses:
        "200":
          description: Criança atualizada com foto de perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Child"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /notifications:
    get:
      tags: [Notifications]
      operationId: listNotifications
      summary: Listar notificações in-app do responsável
      description: |
        Avisos relacionados à trilha. Push definitivo TBD — esta API é o
        fallback in-app. Provider de push permanece abstrato (noop).
      security:
        - bearerAuth: []
      parameters:
        - name: unreadOnly
