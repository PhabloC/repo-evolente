    SubscriptionStatus:
      type: string
      description: |
        Ciclo canônico: pending → active → overdue → suspended → canceled.
        `refused` é caminho lateral a partir de pending (pagamento recusado).
      enum:
        - pending
        - active
        - overdue
        - suspended
        - canceled
        - refused
    SubscriptionAudience:
      type: string
      enum:
        - profissional
        - responsavel
    SubscriptionPaymentMethod:
      type: string
      description: Meios aceitos no Asaas
      enum:
        - credit_card
        - pix
        - boleto
    SubscriptionPlan:
      type: object
      description: Planos mensais oficiais (BRL)
      required:
        - audience
        - amountCents
        - currency
        - interval
      properties:
        audience:
          $ref: "#/components/schemas/SubscriptionAudience"
        amountCents:
          type: integer
          description: |
            profissional=7900 (R$ 79,00); responsavel=4900 (R$ 49,00)
          enum: [4900, 7900]
        currency:
          type: string
          const: BRL
        interval:
          type: string
          const: monthly
    Subscription:
      type: object
      required:
        - id
        - userId
        - audience
        - status
        - provider
        - checkoutId
        - amountCents
        - currency
        - interval
        - paymentMethod
        - confirmedAt
        - firstPaidAt
        - overdueSince
        - refundEligibleUntil
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        userId:
          type: string
          format: uuid
        audience:
          $ref: "#/components/schemas/SubscriptionAudience"
        status:
          $ref: "#/components/schemas/SubscriptionStatus"
        provider:
          type: string
          description: Nome do PaymentProvider (`asaas` ou `fake`)
          example: asaas
        checkoutId:
          type: string
        amountCents:
          type:
            - integer
            - "null"
          description: |
            Valor do plano em centavos. profissional=7900; responsavel=4900.
            Com PAYMENT_PROVIDER=fake pode permanecer null apenas em legado de testes.
        currency:
          type: string
          const: BRL
        interval:
          type: string
          const: monthly
        paymentMethod:
          oneOf:
            - $ref: "#/components/schemas/SubscriptionPaymentMethod"
            - type: "null"
        confirmedAt:
          type:
            - string
            - "null"
          format: date-time
          description: Momento da transição pending → active
        firstPaidAt:
          type:
            - string
            - "null"
          format: date-time
          description: Confirmação do 1º pagamento (base da janela de reembolso)
        overdueSince:
          type:
            - string
            - "null"
          format: date-time
          description: Início do status overdue; após 3 dias → suspended
        refundEligibleUntil:
          type:
            - string
            - "null"
          format: date-time
          description: firstPaidAt + 3 dias; null se não elegível
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    SubscriptionStatusResponse:
      type: object
      required:
        - accessGranted
        - subscriptionRequired
        - subscription
        - plans
      properties:
        accessGranted:
          type: boolean
          description: true para master, active e overdue
        subscriptionRequired:
          type: boolean
        subscription:
          oneOf:
            - $ref: "#/components/schemas/Subscription"
            - type: "null"
        plans:
          type: array
          items:
            $ref: "#/components/schemas/SubscriptionPlan"
          description: Planos oficiais (profissional 7900; responsável 4900)
        pendingCheckout:
          oneOf:
            - $ref: "#/components/schemas/SubscriptionPendingCheckout"
            - type: "null"
          description: Presente quando há assinatura pending (para retomar fatura sem criar outra)
    SubscriptionAccessResponse:
