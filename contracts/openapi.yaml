      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "200":
          description: Metadados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Reports]
      operationId: deleteEvolutionReport
      summary: Excluir relatório gerado
      description: |
        Remove permanentemente um relatório criado pelo próprio profissional.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
        "204":
          description: Relatório excluído
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /reports/{reportId}/download:
    get:
      tags: [Reports]
      operationId: downloadEvolutionReport
      summary: Baixar arquivo do relatório
      description: |
        Responsável recebe 403 se o relatório ainda não foi disponibilizado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ReportId"
      responses:
