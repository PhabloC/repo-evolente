openapi: 3.1.0
info:
  title: Evolente API Contract
  version: 0.1.0
  description: |
    Contrato central para alinhamento entre front-end (React/Vite), backend e mobile.

    Escopo desta versão base:
    - autenticação (login e recuperação de senha)
    - usuários e papéis (master, profissional, responsável)
    - status ativo/inativo (inativação; sem exclusão definitiva nesta fase)
    - cadastro de profissional (individual/clínica) sem liberar acesso completo
    - cadastro público só do responsável; criança + anamnese no POST autenticado de filho (sem login da criança)
    - assinatura/gate de acesso com gateway Asaas (provider fake ainda disponível em dev)
    - catálogo de conteúdos áudio/vídeo com mídia em storage (não no banco)
    - gestão de pacientes do profissional (vínculo por código, isolamento, inativação)
    - trilhas semanais do catálogo master, progresso e registros de evolução
    - administração master (métricas, usuários, assinaturas, logs e árvore profissional→pacientes)
    - relatórios de evolução em PDF com disponibilização controlada ao responsável

    Fora de escopo nesta versão:
    - UI de montagem/execução de trilha (tasks front/mobile)
    - provider S3 definitivo (interface pronta; local em dev)
    - gamificação, pontuação e medalhas
    - perfil paciente/criança não possui login próprio
    - viewer mobile dedicado de relatórios
    - checkout Asaas nativo no mobile (checkout na web)
servers:
  - url: https://api.example.com
    description: Ambiente de referência (substituir por URL real)
tags:
  - name: Auth
    description: Autenticação e recuperação de senha
  - name: Users
    description: Usuários autenticáveis da plataforma
  - name: Roles
    description: Papéis de acesso documentados
  - name: Professionals
    description: Cadastro e perfil de profissionais
  - name: Guardians
    description: Cadastro público do responsável; filhos e anamnese após pagamento
  - name: Subscriptions
    description: |
      Assinatura mensal Asaas, checkout (cartão/PIX/boleto) e gate de acesso.
      Ciclo canônico: PENDING → ACTIVE → OVERDUE → SUSPENDED → CANCELED.
      Master é isento.
  - name: Contents
    description: Catálogo de atividades áudio/vídeo do master (mídia em storage)
  - name: Patients
    description: Pacientes vinculados ao profissional (isolamento por vínculo; sem exclusão)
  - name: Trails
    description: Trilhas semanais montadas pelo profissional a partir do catálogo master
  - name: Progress
    description: Conclusão de atividades e histórico de evolução da criança
  - name: Admin
    description: Administração master (métricas, usuários, planos, logs e árvore de pacientes)
  - name: Notifications
    description: Notificações in-app do responsável (push provider TBD)
  - name: Reports
    description: Relatórios de evolução em PDF e disponibilização ao responsável
paths:
  /professionals/register:
    post:
      tags: [Professionals]
      operationId: registerProfessional
      summary: Cadastrar profissional (individual ou clínica)
      description: |
        Cria conta com papel profissional e perfil de atuação.
        Aceita uma ou mais especialidades (não restrito a fonoaudiologia).
        Dados de clínica são obrigatórios quando practiceType=clinica.
        A conta é criada ativa para login, mas accessGranted permanece false
        até confirmação de pagamento (fora deste endpoint).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterProfessionalRequest"
      responses:
        "201":
          description: Profissional cadastrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfessionalRegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /guardians/register:
    post:
      tags: [Guardians]
      operationId: registerGuardian
      summary: Cadastrar responsável
      description: |
        Breaking change: o payload legado com `child` e `anamnese` deixa de ser
        aceito (400). Cria apenas a conta autenticável do responsável.
        Valida maioridade (>= 18) e CPF. Parentesco não é coletado aqui.
        accessGranted permanece false até pagamento.
        Filho, anamnese, código único e categorias de trilha são criados em
        POST /guardians/me/children após a assinatura.
        Contas antigas que já nasceram com um filho no register atômico
        continuam válidas na listagem.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterGuardianRequest"
      responses:
        "201":
          description: Responsável cadastrado (sem sessão e sem filho)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianRegistrationResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "409":
          $ref: "#/components/responses/Conflict"
  /guardians/me/children:
    get:
      tags: [Guardians]
      operationId: listMyChildren
      summary: Listar crianças do responsável autenticado
      description: |
        Usado pela web e pelo app para listar todos os filhos da conta.
        A lista pode estar vazia após o pagamento, antes do primeiro cadastro.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Filhos do responsável
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GuardianChildrenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Guardians]
      operationId: createMyChild
      summary: Cadastrar filho com anamnese
      description: |
        Exige responsável autenticado com accessGranted.
        Cria criança sem login, código único de paciente, anamnese (perguntas 1–8)
        e suggestedTrailCategories a partir da pergunta 6.
        Parentesco é do filho. Sem teto de filhos nesta versão.
        A montagem da trilha semanal pode permanecer pendente.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateGuardianChildRequest"
      responses:
        "201":
          description: Filho e anamnese cadastrados
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CreateGuardianChildResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /auth/login:
    post:
      tags: [Auth]
      operationId: login
      summary: Autenticar com e-mail e senha
      description: |
        Autentica um usuário ativo. Contas inativas devem ser rejeitadas.
        Papéis válidos: master, profissional, responsavel.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Autenticação bem-sucedida
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: Conta inativa ou sem permissão de acesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/logout:
    post:
      tags: [Auth]
      operationId: logout
      summary: Encerrar sessão atual
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Sessão encerrada
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/refresh:
    post:
      tags: [Auth]
      operationId: refreshSession
      summary: Renovar sessão autenticada
      description: |
        Troca um refresh token válido por um novo par de tokens sem exigir novo login.
        Usado pelo cliente web quando o access token expira por ociosidade.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RefreshTokenRequest"
      responses:
        "200":
          description: Sessão renovada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Refresh token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /auth/password-recovery:
    post:
      tags: [Auth]
      operationId: requestPasswordRecovery
      summary: Solicitar recuperação de senha
      description: |
        Recebe o e-mail e, se existir conta associada, dispara o envio do link
        de recuperação. A resposta não deve revelar se o e-mail existe.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordRecoveryRequest"
      responses:
        "202":
          description: Solicitação aceita para processamento
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordRecoveryResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
  /auth/password-reset:
    post:
      tags: [Auth]
      operationId: resetPassword
      summary: Redefinir senha com token do link
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PasswordResetRequest"
      responses:
        "204":
          description: Senha redefinida com sucesso
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: Token inválido ou expirado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /users/me:
    get:
      tags: [Users]
      operationId: getCurrentUser
      summary: Obter usuário autenticado
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Usuário atual
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
    patch:
      tags: [Users]
      operationId: updateCurrentUserProfile
      summary: Atualizar nome e telefone do usuário autenticado
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateOwnProfileRequest"
      responses:
        "200":
          description: Perfil atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users/me/avatar:
    post:
      tags: [Users]
      operationId: uploadCurrentUserAvatar
      summary: Upload da foto de perfil do usuário autenticado
      description: |
        Envia imagem em Base64 (sem prefixo data-URL) para o bucket.
        Aceita `image/jpeg`, `image/png` e `image/webp`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadImageBase64Request"
      responses:
        "200":
          description: Usuário atualizado com foto de perfil
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /users:
    post:
      tags: [Users]
      operationId: createUser
      summary: Criar usuário
      description: |
        Cadastro administrativo de usuários autenticáveis. Destinado ao papel
        master nesta fase, inclusive para criação de outro usuário master.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateUserRequest"
      responses:
        "201":
          description: Usuário criado com sucesso
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
    get:
      tags: [Users]
      operationId: listUsers
      summary: Listar usuários
      description: |
        Listagem administrativa. Destinada ao papel master nesta fase.
        Suporta filtro por papel, status (ativo/inativo) e termo parcial de
        nome ou e-mail, sem diferenciação de maiúsculas, minúsculas ou acentos.
      security:
        - bearerAuth: []
      parameters:
        - name: role
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/Role"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/UserStatus"
        - name: search
          in: query
          required: false
          description: Termo parcial para buscar no nome ou e-mail do usuário.
          schema:
            type: string
            maxLength: 100
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        "200":
          description: Lista paginada de usuários
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /users/{userId}:
    get:
      tags: [Users]
      operationId: getUserById
      summary: Obter usuário por id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      responses:
        "200":
          description: Usuário encontrado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /users/{userId}/status:
    patch:
      tags: [Users]
      operationId: updateUserStatus
      summary: Ativar ou inativar usuário
      description: |
        Nesta fase, usuários não são excluídos. Master pode inativar
        profissionais e responsáveis; a reativação usa o mesmo endpoint.
        Master não pode inativar a própria conta (403 CANNOT_INACTIVATE_SELF).
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/UserId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserStatusRequest"
      responses:
        "200":
          description: Status atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /roles:
    get:
      tags: [Roles]
      operationId: listRoles
      summary: Listar papéis documentados
      description: |
        Retorna os papéis autenticáveis da plataforma.
        Paciente/criança não é um papel de login.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Papéis disponíveis
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RoleListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /subscriptions/me:
    get:
      tags: [Subscriptions]
      operationId: getSubscriptionStatus
      summary: Consultar status de assinatura e acesso do usuário autenticado
      description: |
        Master é isento (accessGranted=true, subscriptionRequired=false).
        Profissional e responsável retornam accessGranted do perfil e a
        assinatura mais recente, se existir.

        Ciclo de status (enum em lowercase no payload):
        pending → active → overdue → suspended → canceled.
        accessGranted=true apenas em active e overdue (carência de 3 dias).
        suspended implica conta inativada; canceled bloqueia acesso.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Status de assinatura
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionStatusResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /subscriptions/access:
    get:
      tags: [Subscriptions]
      operationId: checkSubscriptionAccess
      summary: Probe do gate de acesso completo
      description: |
        Retorna 200 somente se o usuário tiver acesso liberado.
        Master sempre passa. Profissional/responsável precisam de
        accessGranted=true (status active ou overdue).
        pending, refused, suspended e canceled retornam 403.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Acesso liberado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionAccessResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /subscriptions/checkout:
    post:
      tags: [Subscriptions]
      operationId: createSubscriptionCheckout
      summary: Iniciar checkout de assinatura (Asaas ou fake)
      description: |
        Cria assinatura em status pending via PaymentProvider.
        Com PAYMENT_PROVIDER=asaas: cobrança/assinatura mensal no Asaas.
        Planos: profissional 7900 centavos; responsável 4900 centavos; BRL; mensal.
        Meios aceitos: credit_card (Checkout recorrente), pix e boleto
        (assinatura clássica Asaas). Informe `paymentMethod` no body.
        PIX/boleto exigem CPF (responsável) ou CNPJ da clínica (profissional).
        Master não pode iniciar checkout.
        Com PAYMENT_PROVIDER=fake: mantém fluxo simulado (dev/testes).
      security:
        - bearerAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSubscriptionCheckoutRequest"
      responses:
        "201":
          description: Checkout criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionCheckoutResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /subscriptions/confirm:
    post:
      tags: [Subscriptions]
      operationId: confirmSubscriptionCheckout
      summary: Confirmar ou recusar checkout (somente provider fake)
      description: |
        Disponível apenas com PAYMENT_PROVIDER=fake.
        Com Asaas, a confirmação ocorre via webhook `/subscriptions/webhooks/asaas`.
        outcome=success → status active e accessGranted=true.
        outcome=refused → status refused sem liberar acesso.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ConfirmSubscriptionRequest"
      responses:
        "200":
          description: Resultado da confirmação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionConfirmResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /subscriptions/cancel:
    post:
      tags: [Subscriptions]
      operationId: cancelSubscription
      summary: Cancelar assinatura do usuário autenticado
      description: |
        Transição para canceled com bloqueio imediato (accessGranted=false).
        Não espera o fim do ciclo mensal.
        Aplicável a assinaturas active ou overdue.
        Master não possui assinatura cancelável (isento).
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Assinatura cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionConfirmResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /subscriptions/refund:
    post:
      tags: [Subscriptions]
      operationId: refundSubscription
      summary: Solicitar reembolso por arrependimento
      description: |
        Permitido apenas até 3 dias de uso após a confirmação do 1º pagamento
        (firstPaidAt). Em sucesso: status canceled, bloqueio imediato e
        estorno no Asaas quando PAYMENT_PROVIDER=asaas.
        Fora da janela: 400 com erro de negócio.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Reembolso processado e assinatura cancelada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionConfirmResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /subscriptions/verify:
    post:
      tags: [Subscriptions]
      operationId: verifySubscriptionPayment
      summary: Verificar pagamento no provedor (fallback do webhook)
      description: |
        Usado pelo botão "Já paguei" no gate. Consulta o Asaas (ou fake) se o
        checkout/assinatura pendente já foi pago e, se sim, libera o acesso
        mesmo sem o webhook ter chegado. Idempotente quando já active/overdue.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Resultado da verificação
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionVerifyResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /subscriptions/webhooks/asaas:
    post:
      tags: [Subscriptions]
      operationId: asaasSubscriptionWebhook
      summary: Webhook do gateway Asaas
      description: |
        Callback autenticado pelo header/token configurado em
        PAYMENT_GATEWAY_WEBHOOK_SECRET (sem JWT de usuário).
        Deve ser idempotente. Eventos típicos atualizam o ciclo:
        pagamento confirmado / CHECKOUT_PAID → active; atraso → overdue;
        carência esgotada (3 dias) → suspended (inativa conta);
        cancelamento/estorno externo → canceled;
        PAYMENT_CREATED e PAYMENT_REFUND_IN_PROGRESS atualizam vínculo
        da cobrança sem mudar o ciclo; captura de cartão recusada → refused.
        Disponível quando PAYMENT_PROVIDER=asaas.
      security: []
      parameters:
        - name: asaas-access-token
          in: header
          required: true
          description: Token de autenticação do webhook Asaas (secret)
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AsaasSubscriptionWebhookRequest"
      responses:
        "200":
          description: Evento processado (ou ignorado de forma idempotente)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionWebhookAck"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /subscriptions/webhooks/fake:
    post:
      tags: [Subscriptions]
      operationId: fakeSubscriptionWebhook
      summary: Webhook simulado do provider fake
      description: |
        Endpoint de borda para simular callback do gateway sem autenticação JWT.
        Usado apenas com PAYMENT_PROVIDER=fake. Com Asaas, usar
        `/subscriptions/webhooks/asaas`.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FakeSubscriptionWebhookRequest"
      responses:
        "200":
          description: Resultado do webhook simulado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubscriptionConfirmResponse"
        "404":
          $ref: "#/components/responses/NotFound"
  /contents:
    get:
      tags: [Contents]
      operationId: listContents
      summary: Listar conteúdos do catálogo
      description: |
        Master vê todos (filtro opcional por status).
        Profissional e responsável veem apenas conteúdos active.
        Responsável usa a listagem para resolver título/mídia das atividades da trilha.
        Conteúdos interativos retornam `mediaType=game`, `gameType` e `gameConfig`.
        Categorias alinhadas às áreas da pergunta 6 da anamnese.
      security:
        - bearerAuth: []
      parameters:
        - name: category
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ContentCategory"
        - name: mediaType
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ContentMediaType"
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/ContentStatus"
      responses:
        "200":
          description: Lista de conteúdos
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Contents]
      operationId: createContent
      summary: Criar metadados de conteúdo (master)
      description: |
        Cria atividade áudio, vídeo ou jogo com metadados.
        Para áudio e vídeo, o upload da mídia é feito em POST /contents/{contentId}/media.
        Para jogo, `gameType` e `gameConfig` definem o renderer consumido pelo app.
        Mídia nunca é persistida no banco — apenas chave/URL de storage.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateContentRequest"
      responses:
        "201":
          description: Conteúdo criado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
  /contents/{contentId}:
    get:
      tags: [Contents]
      operationId: getContent
      summary: Obter conteúdo por id
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "200":
          description: Conteúdo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    delete:
      tags: [Contents]
      operationId: deleteContent
      summary: Excluir conteúdo do catálogo (master)
      description: |
        Remove definitivamente o conteúdo e a mídia associada quando existir.
        Conteúdos já usados em trilhas ou no histórico de evolução não podem ser excluídos.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContentId"
      responses:
        "204":
          description: Conteúdo excluído com sucesso
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    patch:
      tags: [Contents]
      operationId: updateContent
      summary: Atualizar metadados ou status (master)
      description: |
        Permite atualizar metadados e inativar/reativar o conteúdo.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateContentRequest"
      responses:
        "200":
          description: Conteúdo atualizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /contents/{contentId}/media:
    post:
      tags: [Contents]
      operationId: uploadContentMedia
      summary: Upload de mídia para storage (master)
      description: |
        Envia arquivo em Base64 (sem prefixo data-URL).
        Valida MIME (áudio/vídeo) e tamanho máximo.
        Conteúdos `game` não aceitam upload nesta rota.
        Arquivo vai para storage local (dev) ou provider futuro S3-compatível.
        Multipart pode ser adicionado quando @types/multer for autorizado.
      security:
        - bearerAuth: []
      parameters:
        - $ref: "#/components/parameters/ContentId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadContentMediaRequest"
      responses:
        "200":
          description: Mídia associada ao conteúdo
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Content"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /patients:
    get:
      tags: [Patients]
      operationId: listPatients
      summary: Listar pacientes do profissional autenticado
      description: |
        Retorna apenas pacientes vinculados ao profissional do JWT.
        Exige assinatura ativa (accessGranted).
      security:
        - bearerAuth: []
      parameters:
        - name: status
          in: query
          required: false
          schema:
            $ref: "#/components/schemas/PatientLinkStatus"
      responses:
        "200":
          description: Lista de pacientes do profissional
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientListResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [Patients]
      operationId: createPatient
      summary: Criar responsável + criança + anamnese e vincular ao profissional
      description: |
        Fluxo profissional separado e ainda atômico: cria responsável, criança
        (com parentesco e código único), anamnese e o vínculo inicial com o
        profissional autenticado. Não usa POST /guardians/register (que agora
        cadastra só o responsável).
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePatientRequest"
      responses:
        "201":
          description: Paciente criado e vinculado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PatientDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
  /patients/link:
    post:
      tags: [Patients]
      operationId: linkPatientByCode
      summary: Vincular paciente existente pelo código único
      description: |
        Cada profissional pode solicitar o vínculo uma única vez por criança.
        A solicitação nasce pendente e só libera o acompanhamento após a
        aprovação do responsável.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LinkPatientRequest"
      responses:
