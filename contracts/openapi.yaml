  /admin/subscriptions/{subscriptionId}/status:
    patch:
      tags: [Admin]
      operationId: updateAdminSubscriptionStatus
      summary: Atualizar status de assinatura (master)
      description: |
        Atualiza status administrativo da assinatura e sincroniza accessGranted.
        Status do ciclo: pending, active, overdue, suspended, canceled, refused.
        Sem exclusão definitiva.
      security:
        - bearerAuth: []
      parameters:
        - name: subscriptionId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAdminSubscriptionStatusRequest"
      responses:
        "200":
          description: Assinatura atualizada
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Subscription"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ContentId:
      name: contentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PatientId:
      name: patientId
      in: path
      required: true
      description: ID da criança (child.id)
      schema:
        type: string
        format: uuid
    ConsultationId:
      name: consultationId
      in: path
      required: true
      description: ID da consulta presencial
      schema:
        type: string
        format: uuid
    ChildId:
      name: childId
      in: path
      required: true
      description: ID da criança (child.id)
      schema:
        type: string
        format: uuid
    TrailId:
      name: trailId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ReportId:
      name: reportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Requisição inválida
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Não autenticado ou credenciais inválidas
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Forbidden:
      description: Autenticado, mas sem permissão
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Conflict:
      description: "Conflito de recurso (ex.: e-mail já cadastrado)"
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
  schemas:
    Role:
      type: string
      description: |
        Papéis autenticáveis. Paciente/criança não possui login próprio
        e portanto não é um valor deste enum.
      enum:
        - master
        - profissional
        - responsavel
    UserStatus:
      type: string
      description: Estado da conta. Inativação substitui exclusão nesta fase.
      enum:
        - active
        - inactive
    CreateUserRequest:
      type: object
      required:
        - name
        - email
        - password
        - role
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
          maxLength: 64
          pattern: "^(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,64}$"
          description: >-
            Mínimo 8 caracteres, com pelo menos uma letra maiúscula, um número
            e um caractere especial.
        phone:
          type: string
          maxLength: 32
          nullable: true
        role:
          $ref: "#/components/schemas/Role"
    UpdateOwnProfileRequest:
      type: object
      description: Atualização parcial do próprio perfil (nome e/ou telefone).
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        phone:
          type: string
          maxLength: 32
          nullable: true
    User:
      type: object
      required:
        - id
        - email
        - name
        - avatarUrl
        - avatarMimeType
        - avatarOriginalName
        - avatarSizeBytes
        - role
        - status
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        name:
          type: string
          minLength: 1
        phone:
          type: string
          nullable: true
          description: Telefone de contato; obrigatório no cadastro profissional
        avatarUrl:
          type: string
          nullable: true
        avatarMimeType:
          type: string
          nullable: true
        avatarOriginalName:
          type: string
          nullable: true
        avatarSizeBytes:
          type: integer
          nullable: true
        role:
          $ref: "#/components/schemas/Role"
        status:
          $ref: "#/components/schemas/UserStatus"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    PracticeType:
      type: string
      description: Tipo de atuação do profissional
      enum:
        - individual
        - clinica
    ClinicData:
      type: object
      required:
        - legalName
        - cnpj
        - phone
      properties:
        legalName:
          type: string
          minLength: 2
          description: Razão social
        cnpj:
          type: string
          description: CNPJ com 14 dígitos (pode incluir máscara)
          minLength: 14
          maxLength: 18
        phone:
          type: string
          minLength: 8
          maxLength: 32
    RegisterProfessionalRequest:
      type: object
      required:
        - name
        - email
        - phone
        - password
        - specialties
        - practiceType
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 80
        email:
          type: string
          format: email
        phone:
          type: string
          minLength: 8
          maxLength: 32
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 64
          pattern: "^(?=.*[A-Z])(?=.*[0-9])(?=.*[^A-Za-z0-9]).{8,64}$"
          description: >-
            Mínimo 8 caracteres, com pelo menos uma letra maiúscula, um número
            e um caractere especial.
        specialties:
          type: array
          minItems: 1
          items:
