        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
  /reports:
    post:
      tags: [Reports]
      operationId: createEvolutionReport
      summary: Gerar relatório de evolução em PDF
      description: |
        Profissional gera um PDF a partir dos registros de evolução do paciente
