        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    get:
      tags: [Reports]
      operationId: listEvolutionReports
      summary: Listar relatórios de evolução
      description: |
        Profissional lista os próprios relatórios.
        Responsável lista apenas os disponibilizados dos seus filhos.
      security:
        - bearerAuth: []
      parameters:
        - name: patientId
