          description: Relatório disponibilizado
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EvolutionReport"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
