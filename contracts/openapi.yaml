    ContentMediaType:
      type: string
      enum: [audio, video, game]
    ContentGameType:
      type: string
      enum:
        [
          alphabet,
          alphabet-writing,
          word-search,
          memory,
          spot-difference,
          whats-missing,
          shadow-match,
          jigsaw,
          traffic-light,
          odd-one-out,
          sentence-fill,
          word-spell,
          emotions,
          fluency,
          dialogue,
        ]
    AlphabetGameConfig:
      type: object
      required:
        - letters
        - locale
        - voiceMode
      description: |
        Configuração base reutilizada pelos jogos do alfabeto.
        `alphabet` usa as letras para toque e pronúncia.
        `alphabet-writing` usa as letras como conjunto de sorteio para escrita guiada.
        `coverUrl`, `modalCoverUrl` e `letterImages` são opcionais.
        No alfabeto falado, cobrem capa do card, capa ilustrada do modal
        de prévia e artes por letra.
        No jogo de escrita guiada, `coverUrl` aponta a capa do card e
        `modalCoverUrl` a capa ilustrada do modal de prévia.
      properties:
        letters:
          type: array
          minItems: 1
          maxItems: 26
          items:
            type: string
            pattern: "^[A-Z]$"
        locale:
          type: string
          example: pt-BR
        voiceMode:
          type: string
          enum: [tts, recorded]
        coverUrl:
          type:
            - string
            - "null"
          format: uri
          description: URL pública da capa do jogo no storage
        modalCoverUrl:
          type:
            - string
            - "null"
          format: uri
          description: |
            Capa ilustrada do modal de prévia (alfabeto falado ou escrita de letras).
        letterImages:
          type:
            - object
            - "null"
          description: Mapa de letra (A-Z) para URL pública da arte no storage
          additionalProperties:
            type: string
            format: uri
          example:
